name: Trigger auto deployment for meeting-bot-dev

on:
  push:
    branches: 
      - dev
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write 
      contents: read 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MEETINGBOTDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MEETINGBOTDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MEETINGBOTDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name meetingbotdevacr

      - name: Build and Push Docker Image
        run: |
          docker build -t meetingbotdevacr.azurecr.io/meeting-bot-dev:${{ github.sha }} .
          docker push meetingbotdevacr.azurecr.io/meeting-bot-dev:${{ github.sha }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: meeting-bot-dev
          resourceGroup: rg-container-dev
          imageToDeploy: meetingbotdevacr.azurecr.io/meeting-bot-dev:${{ github.sha }}
